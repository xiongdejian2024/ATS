name: 软件功能检查
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Agent 与 SAT 适配器（无硬件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装现有集成依赖
        run: python -m pip install -r requirements-integration.txt
      - name: 校验结果选择、超时、取消和损坏消息恢复
        run: python -m pytest tests/test_sat_adapter.py -q -o addopts=''
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
