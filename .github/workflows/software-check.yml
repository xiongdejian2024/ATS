name: 软件功能检查
on:
  push:
    branches: [main, 'codex/**']
    paths: ['backend/**', 'agent/**', 'frontend/**', 'tests/**', 'scripts/**', 'xat/framework/**', 'requirements-integration.txt', '.github/workflows/software-check.yml']
  pull_request:
    paths: ['backend/**', 'agent/**', 'frontend/**', 'tests/**', 'scripts/**', 'xat/framework/**', 'requirements-integration.txt', '.github/workflows/software-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: XAT 集成与 Agent（无硬件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装现有集成依赖
        run: python -m pip install -r requirements-integration.txt
      - name: 校验 XAT 插件、原示例结果、硬件关闭及 Agent 结果恢复
        run: python -m pytest tests -q -o addopts=''
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build

  mysql-migration:
    name: MySQL 8 脚本作业迁移（临时合成数据）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: ats_migration_test
          MYSQL_USER: ats_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - '127.0.0.1:3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-integration.txt
      - name: 验证旧行和外键保留、迁移幂等及新脚本队列约束
        env:
          ATS_MYSQL_TEST_URL: mysql+pymysql://ats_test:ci-test-only@127.0.0.1:3306/ats_migration_test
          ATS_MYSQL_ISOLATED: '1'
        run: python -m pytest tests/test_script_jobs_mysql_migration.py -q -o addopts=''
