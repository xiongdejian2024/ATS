name: XAT 独立 ECU 库检查
on:
  push:
    branches: [main, 'codex/**']
    paths: ['xat/packages/ecu/**', '.github/workflows/xat-library.yml']
  pull_request:
    paths: ['xat/packages/ecu/**', '.github/workflows/xat-library.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 仅安装库及测试依赖
        run: python -m pip install -e 'xat/packages/ecu[test]'
      - name: 验证库功能及框架隔离
        run: python -m pytest xat/packages/ecu/tests --noconftest -q
