[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xat-ecu"
version = "0.2.0"
description = "XAT 独立 ECU 协议、模拟、诊断、驱动与业务库"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "attrs>=22", "jsonschema>=4", "construct>=2.10.67"]

[project.optional-dependencies]
can = ["python-can>=4", "cantools>=37"]
ssh = ["paramiko>=2.11", "scp>=0.14"]
serial = ["pyserial>=3.5"]
security = ["pycryptodome>=3.15", "cryptography>=39"]
network = ["requests>=2.28", "scapy>=2.5"]
protocols = ["protobuf>=7.35.1,<8"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xat_ecu*"]

[tool.setuptools.package-data]
xat_ecu = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.csv", "**/*.dbc", "**/*.arxml", "**/*.ldf", "**/*.dll", "**/*.so", "**/*.dylib", "**/*.lib", "**/*.h", "**/*.proto", "**/*.xlsx", "**/*.xls", "**/*.sh", "**/*.source", "**/*.txt", "**/*.md", "**/*.xml", "**/*.ini", "**/*.cfg", "**/*.bin", "**/*.tmpl", "**/*.pickle", "**/*.pem", "**/*.vxt", "**/*.bat", "legacy/interface/bgm/adb", "legacy/interface/bgm/tcpdump", "legacy/interface/bgm/soa_api_test", "legacy/interface/tcam/soa_api_test", "legacy/interface/tcam/tcam_seco_api_test", "legacy/interface/bgm/dbg-utils.tar.bz2", "legacy/interface/bgm/bgm_env/config/mcu_update_config/*/ua_server_app", "legacy/interface/bgm/bgm_env/config/mcu_update_config/*/ua_client_app"]
