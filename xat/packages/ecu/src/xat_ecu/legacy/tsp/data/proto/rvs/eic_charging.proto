//充电慢原因及电池温度
message ChargingSlowRemind {
  float  temperature                              = 1 ;//显示温度 65535 为无效值 显示 -- °C   -256~255.9 精度 0.1
  repeated ChargingSlowReason  reason             = 2 ;//充电慢原因
}

//充电慢原因 提示优先级说明：充电桩功率受限>电量较高>电池温度低；
enum ChargingSlowReason	{
  CLReasonNone                                             		= 0 ;// 无原因 充电正常 (kNone)
  CLReasonTemperatureLow                                   		= 1 ;// 电池温度低 (kTemperatureLow)
  CLReasonSOCHigh                                          		= 2 ;//电量较高，充电功率下降  (kSOCHigh)
  CLReasonEquipmentLimit                                   		= 3 ;//充电桩输出功率低  (kEquipmentLimit)
  CLReasonEmpty                                             	= -1 ;//-- (Empty)
}
// 磷酸铁锂电池需满充提醒
message FullChargingRemind {
  bool remind                               = 1 ;//是否显示提醒
  //  int64  energySinceLastFullCharge                    = 2 ;//未有需求 自上次满充后累计充入的电量 -1 代表默认无效值
}

//充放电设备类型（交流/直流）
enum ACDCType	{
  ACDCTypeDefault                                          		= 0 ;//Default 未连接 当前无 (kDefault)
  ACDCTypeDC                                               		= 1 ;//直流枪连接 直流相关状态 (kDC)
  ACDCTypeAC                                               		= 2 ;//交流枪连接 交流相关状态 (kAC)
  ACDCTypeACDC                                             		= 3 ;//交流枪直流枪都连接（当前不支持） (kACDC)
  ACDCTypeUnknown                                          		= 255 ;//未知设备类型 (kUnknown)
  ACDCTypeEmpty                                             	= -1 ;//-- (Empty)
}
