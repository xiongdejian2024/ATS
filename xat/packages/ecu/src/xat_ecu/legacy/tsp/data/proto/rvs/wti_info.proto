syntax = "proto3";
package vehiclestatus;
import "common.proto";
import "block_head.proto";

// =====================================================================
// 报警信息块
// =====================================================================

// 报警信息
message WtiInfoBlock {
  BlockHead                       head          = 1 ; //公共头
  repeated TyreFault              tireFault     = 2; // 轮胎报警信息
  repeated LowVoltageFault        batteryFault  = 3; // 电池报警信息
  WtiCharging                     charging      = 4; // 充电报警信息
  AntiTheft                       antiTheft     = 5; // 防盗报警信息
  BrakeWti                        brakeWti      = 6; // 运动控制
//  map<string,string>              wtiStatus     = 7;  // 异常集合
}
// 轮胎报警信息
message TyreFault {
  TyreId 	        tyre           = 1; // 对应的轮胎
  TyreFaultId     fault          = 2; // 故障Id
  string          faultMsg       = 3; // 故障描述

}

// 电池报警信息
message LowVoltageFault {
  LowVoltageFaultId 	faultId = 1 ; //低压系统故障ID
  string 	            faultMsg = 2 ; //故障描述信息
}

// --------------------------------------------------
// 高压充电报警
//https://jama.jiduauto.com/perspective.req#/items/196499?projectId=46
message WtiCharging {
  bool      isFail = 1; // 是否充电失败
}


// 防盗报警
message AntiTheft {
  AlarmState     state      = 1; //防盗报警状态
  Bool           isAlarm    = 2; //防盗触发状态
  string         alarmTime  = 4; //防盗触发时间
}

//运动控制异常
message BrakeWti {
    SteerErrorReqStatus   steerError           =  1;  //EPS转向错误响应状态
}

// 轮胎故障Id
enum TyreFaultId {
  TyreOk	                                     =	0	;     //	无故障
  TyrePressureLow	                             =	1	;     //	胎压过低
  TyrePressureHigh	                           =	2	;     //	胎压过高
  TyreTemperatureHigh	                         =	3	;     //	胎温过高
  TyreLeakFast	                               =	4	;     //	快速漏气
  TyreMonitorFault	                           =	5	;     //	胎压检测器故障
  TyreBatteryLow	                             =	6	;     //	传感器电池电量低
  TyreMessageOld	                             =	7	;     //	报文过期(旧数据)
  TyrePressureLost	                           =	8	;     //	胎压信息丢失
  TyreFaultNA	                                 =	9	;     //	未知故障
  TyreFaultEmpty                               =	-1	;     //	--
}

// 电池故障Id
enum LowVoltageFaultId {
  FaultVoltageOk                               =	0	;     //	正常（默认）
  FaultVoltageHighDuringDriving                =	1	;     //	驾驶中供电电压高
  FaultVoltageLowDuringDriving                 =	2	;     //	驾驶中供电电压低
  FaultBatteryRelay                            =	3	;     //	电池继电器故障
  FaultBatterySensorCommunication              =	4	;     //	电池传感器通信故障
  FaultBatterySensorHardware                   =	5	;     //	电池传感器硬件故障
  FaultDCDCCommunication                       =	6	;     //	DCDC通信故障
  FaultDCDCHardware                            =	7	;     //	DCDC硬件故障
  FaultDCDCTemperature                         =	8	;     //	DCDC温度异常
  FaultLowPower                                =	9	;     //	小电池电量低
  FaultDataInvalid                             =	10	;     //	底层数据不可用
  FaultNA                                      =	11	;     //	未知故障
  FaultEmpty                                   =	-1	;     //	--
}

enum AlarmState  {
  AsDisarmd                                    = 0;//解防
  AsArmd                                       = 1;//设防
  AsActv                                       = 2;//报警
  AsEmpty                                      = -1;//--
}

//EPS转向错误响应状态
//https://soa.jidudev.com/classjet_1_1vehicle_1_1Car.html#a65451e703a03b1bb0a575819ce4d4e78
enum SteerErrorReqStatus {
  SteerErrorReqStatusNoReq	                   = 0 ; //	无响应
  SteerErrorReqStatusAssiSrvRqrd	             = 1 ; //	AssiSrvRqrd.
  SteerErrorReqStatusStopSfty	                 = 2 ; //	StopSfty.
  SteerErrorReqStatusAssiUrgentSrvRqrd	       = 3 ; //	AssiUrgentSrvRqrd.
  SteerErrorReqStatusAssiTmpRedn	             = 4 ; //	AssiTmpRedn.
  SteerErrorReqStatusReserved1	               = 5 ; //	预留项1
  SteerErrorReqStatusReserved2	               = 6 ; //	预留项2
  SteerErrorReqStatusReserved3	               = 7 ; //	预留项3
  SteerErrorEmpty                              = -1;//--
}

//jidl 1.0.14 变更

// TO：车端RVS soa定义的JIDL WTI数据
message WTISoaData {
  // 标识全量、增量
  WTIDataType dataType = 1;
  // 所属领域
  WTIField wtiField = 2;
  // WTI的key、value与时间戳
  repeated WTIOriginalData wtis = 3;
  // 全量数据上传时 车端全量数据向云投递的毫秒时间戳. 1.3之前该字段无实际意义
  int64 timestamp = 4;

}

// WTI原始数据
message WTIOriginalData {
  // 键的枚举
  WTIKeyID keyID = 1;
  // 值
  string val = 2;
  // 发生的时间戳
  int64 timestamp = 3;
  // 扩展字段
  map<string, string> ext = 4;
}

// wti领域
enum WTIField {
    Unknown = 0;
    // 通用域
    General = 1;
    // 智能驾驶域
    AutoDrive = 2;
    // CDC域
    CDC = 3;
    // 独立服务
    IndependentServices = 4;
}

// wti数据类型
enum WTIDataType {
    WTIDataTypeUnknown = 0;
    // 全量
    All = 1;
    // 增量
    Timely = 2;
}

// WTIStatus wti状态
enum WTIStatus {
    // 未上报
    WTIStatusDefault = 0;
    // 告警中（或指示灯打开）
    InAlarm = 1;
    // 解除告警（或指示灯关闭）
    AlarmRelease = 2;
}

/*
    wti数据项的key的枚举，包括所有的wti项。
    枚举值6位，例如：100100
    第1位是"1"，代表通用域；第1位是"2"，代表智能驾驶域；第1位是"3"，代表CDC域； 第1位是"4"，代表独立服务；
    第2、3、4位代表类别，每个域支持1000类
    第5、6位代表该类别下的子定义，每个类支持100个子定义

    PB按比特位序列化tag，采用定长6位的方式，可读性高，方便扩展，只增加1个字节
    2的10次幂 1024—— 10位，2个字节
    2 的16次幂 65536——16位，2个字节
    2的20次幂 1048576——20位，3个字节
*/

