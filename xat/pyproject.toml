[project]
name = "xat"
version = "0.2.0"
description = "自有 pytest 生命周期与独立 ECU 库接口的 XAT 框架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8,<10",
    "pyyaml>=6",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.28",
    "allure-pytest>=2.13",
]

[project.optional-dependencies]
ecu = ["xat-ecu>=0.2,<1"]
automotive = ["flask-socketio>=5", "python-socketio[client]>=5", "pyserial>=3.5", "requests>=2.28", "psutil>=5.8", "pandas>=2", "openpyxl>=3", "xlrd>=2"]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
xat = "framework.__main__:main"

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.setuptools.package-data]
framework = ["integrations/pytest.ini", "automotive/statics/*", "automotive/scripts/*.sh"]
