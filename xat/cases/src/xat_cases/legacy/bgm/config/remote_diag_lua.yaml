10&11: "---------------------------------------------------------------\r\n--可替换部分\r\
  \n-------------------------------------------------------\r\nFLOWS={\r\n    -- ecu\
  \ addr, diag cmd\r\n    {0x1001,{0x10,0x02}},\r\n    {0x1001,{0x10,0x03}},\r\n \
  \   {0x1001,{0x11,0x01}},\r\n    {0x1002,{0x10,0x02}},\r\n    {0x1002,{0x10,0x03}},\r\
  \n    {0x1002,{0x11,0x01}}\r\n}\r\nUDS_CMD_INTERVEL=1.0\r\n--------------------------------------------------------------\r\
  \n\r\n-----------------------------------------------------------------------------------\r\
  \n-- 固定部分\r\n-----------------------------------------------------------\r\nfunction\
  \ sleep(n)\r\n    if (n > 0) then\r\n        os.execute(\"sleep \" .. tonumber(n))\r\
  \n    end\r\nend\r\n\r\nfunction get_timestamp()\r\n    if (UDS_CMD_INTERVEL<0.1)\
  \ then\r\n        return math.floor(os.time() * 1000 + (os.clock() % 1) * 1000)\r\
  \n    else\r\n        local hd = io.popen(\"echo $(date +%s%N)\")\r\n        local\
  \ result = hd:read(\"*a\")\r\n        hd:close()\r\n        return math.floor(result/1000000)\r\
  \n    end\r\nend\r\n\r\nfunction uds_raw(ecu_addr, data, wait_time, retry, wait_resp)\r\
  \n    local wait_time= wait_time or 5000\r\n    local retry= retry or 0\r\n    local\
  \ wait_resp= wait_resp or true\r\n    local addr, rsp_data, err_code\r\n    while\
  \ (true) do\r\n        addr, rsp_data, err_code = cpp_diag_cmd(ecu_addr, data, wait_time,\
  \ wait_resp)\r\n        if (err_code ~= 0 and err_code ~= 9 and retry > 0) then\r\
  \n            retry = retry - 1\r\n        else\r\n            break\r\n       \
  \ end\r\n    end\r\n    return rsp_data, err_code\r\nend\r\n\r\nfunction check_and_req_arb()\r\
  \n    local is_arbd = cpp_get_signal(5) --5 IsArbitrated\r\n    if (is_arbd) then\r\
  \n        return true\r\n    else\r\n        return cpp_request_arb(1) -- option:\
  \ 1 requst, 2 release\r\n    end\r\nend\r\n\r\nfunction main_entry()\r\n    local\
  \ TASK_ID= T2V_taskId or \"1234\"\r\n    cpp_print_log(\"task id:\"..T2V_taskId)\r\
  \n    local final_code=0 --0成功、1失败、2、会话关闭、3执行超时, 4 arb\r\n    local para_str=\"\
  {\"\r\n    if check_and_req_arb() then\r\n        local data_str=\"[\"\r\n     \
  \   -- start run the cmds\r\n        for key, val in pairs(FLOWS) do\r\n       \
  \     local ecu = val[1]\r\n            local cmd_idx=2\r\n            while (cmd_idx\
  \ <= #val) do\r\n                local cmd = val[cmd_idx]\r\n                cmd_idx\
  \ = cmd_idx + 1\r\n                local request_tm  = get_timestamp()\r\n     \
  \           local rsp_data, err_code\r\n                -- 执行单条指令：超时时间5s, 若有失败retry\
  \ 1次\r\n                rsp_data, err_code = uds_raw(ecu, cmd, 5000, 1, true)\r\n\
  \                if (err_code~=0) then\r\n                    final_code = 1\r\n\
  \                    if (err_code < -1) then -- TODO v1.4\r\n                  \
  \      err_code = -2\r\n                    end\r\n                    -- no break\
  \ -- 出错也继续执行后续命令\r\n                end\r\n                local response_tm  =\
  \ get_timestamp()\r\n                local cmd_res_str=\"{\"\r\n               \
  \ cmd_res_str=cmd_res_str..\"\\\"addr\\\":\".. ecu ..\",\"\r\n                cmd_res_str=cmd_res_str..\"\
  \\\"cmd\\\":[\".. table.concat(cmd, \",\") ..\"],\"\r\n                cmd_res_str=cmd_res_str..\"\
  \\\"cmd_time\\\":\".. request_tm ..\",\"\r\n                cmd_res_str=cmd_res_str..\"\
  \\\"rsp\\\":[\".. table.concat(rsp_data, \",\") ..\"],\"\r\n                cmd_res_str=cmd_res_str..\"\
  \\\"rsp_time\\\":\".. response_tm ..\",\"\r\n                cmd_res_str=cmd_res_str..\"\
  \\\"code\\\":\".. err_code\r\n                cmd_res_str=cmd_res_str..\"}\"\r\n\
  \                data_str=data_str.. cmd_res_str ..\",\"\r\n                -- 检测会话是否还开着\r\
  \n                if not cpp_get_signal(1) then\r\n                    final_code\
  \ = 2\r\n                    break\r\n                end\r\n            end\r\n\
  \            if not cpp_get_signal(1) then\r\n                final_code = 2\r\n\
  \                break\r\n            end\r\n            -- 间隔\r\n            sleep(UDS_CMD_INTERVEL)\r\
  \n        end\r\n        data_str=string.sub(data_str, 1, #data_str - 1)\r\n   \
  \     data_str=data_str..\"]\"\r\n        para_str=para_str..\"\\\"data\\\":\"..data_str..\"\
  ,\"\r\n    else\r\n        final_code = 4\r\n    end\r\n    para_str=para_str..\"\
  \\\"code\\\":\"..final_code\r\n    para_str=para_str..\"}\"\r\n    -- upload reuslts\r\
  \n    local CMD_CODE= T2V_cmd or 3\r\n    cpp_upload_results(TASK_ID, para_str,\
  \ CMD_CODE, 1)\r\nend\r\n-----------------------------------------------------------------------------"
