cali: "------可动态更改部分-----------------------------------------------------------------------------------\r\
  \n-- app id, 默认0 充电口盖标定\r\nCALI_APP_ID=0\r\n-- 是否允许跳过用户授权，默认false\r\nCALI_ALLOW_SKIP_AUTH=false\r\
  \n\r\n\r\n-------固定部分-----------------------------------------------------------------------------\r\
  \nfunction sleep(n)\r\n    if (n > 0) then\r\n        os.execute(\"sleep \" .. tonumber(n))\r\
  \n    end\r\nend\r\n\r\n\r\nfunction main_entry()\r\n    -- luaL_checktype(l, 1,\
  \ LUA_TNUMBER); // opt: 1.trigger, 2 auth, 3 retry\r\n    -- luaL_checktype(l, 2,\
  \ LUA_TNUMBER); // app_id\r\n    -- luaL_checktype(l, 3, LUA_TNUMBER); // req: 1.on,\
  \ 2.off\r\n    -- luaL_checktype(l, 4, LUA_TBOOLEAN);  // allow_skip\r\n    cpp_call_cali(1,CALI_APP_ID,1,\
  \ CALI_ALLOW_SKIP_AUTH) -- 触发\r\n    sleep(3)\r\n    -----------------------------------------------------------------------\r\
  \n    -- 模拟屏幕操作：for test only\r\n    -- remote 方式，默认无诊断仲裁\r\n    -- cpp_call_cali(2,0,1)\
  \ -- auth\r\n    -- sleep(3)\r\n    -- cpp_call_cali(3,0,1) -- retry\r\n    -----------------------------------------------------------------------\r\
  \n\r\n    -- 等待最终结果 for \r\n    local res, log = cpp_query_remote_cali_log()\r\n\
  \    local para_str = log\r\n    local count = 1\r\n    while res ~= 0 do\r\n  \
  \      sleep(1)\r\n        cpp_print_log(\"waiting for cali result\")\r\n      \
  \  count = count + 1\r\n        res, log = cpp_query_remote_cali_log()\r\n     \
  \   if res == 0 then -- ok\r\n            cpp_print_log(\"cali_done \"..log)\r\n\
  \            para_str = log\r\n           break \r\n        else -- continue\r\n\
  \        end\r\n        -- check if session open\r\n        local is_open = cpp_get_signal(1)\r\
  \n        if not is_open then -- abort\r\n            cpp_call_cali(1,CALI_APP_ID,2,\
  \ CALI_ALLOW_SKIP_AUTH) -- 打断\r\n            para_str =\"{\\\"data\\\":[],\\\"checkData\\\
  \":[{\\\"content\\\":\\\"高优先级任务打断，请稍后再试\\\",\\\"time\\\":0,\\\"code\\\":1}],\\\"\
  code\\\":1}\"\r\n            break\r\n        end\r\n        if count > 1*60*5 then\
  \ -- timeout TODO 5min\r\n            cpp_print_log(\"cali_timeout\")\r\n      \
  \      para_str =\"{\\\"data\\\":[],\\\"checkData\\\":[{\\\"content\\\":\\\"标定执行超时\\\
  \",\\\"time\\\":0,\\\"code\\\":1}],\\\"code\\\":1}\"\r\n            break\r\n  \
  \      end\r\n    end\r\n\r\n    local TASK_ID= T2V_taskId or \"1234\"\r\n    local\
  \ CMD_CODE= T2V_cmd or 3\r\n    cpp_upload_results(TASK_ID, para_str, CMD_CODE,\
  \ 1)\r\n    cpp_print_log(\"exit lua\")\r\n\r\nend\r\n"
