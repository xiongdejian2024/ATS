session_open:
  cmd: 1
  para: "------------------------------------\r\n--可替换部分:\r\n--SESSION_TIME_OUT 会话超时时间，单位：秒\r\
    \n--CHECK_INTERVEL 条件检查周期，单位：秒\r\n--------------------------------\r\nSESSION_TIME_OUT=300\r\
    \nCHECK_INTERVEL=5\r\n-------------------------------------\r\n\r\n---------------------------------------------------------------\r\
    \n-- 固定部分\r\n-----------------------------------------------------------\r\nSESSION_ERROR_MSG=\"\
    \\\"Speed Check NG\\\"\" -- default reason in lua\r\nfunction check_condition()\r\
    \n    local speed, valid = cpp_get_signal(2) --sig 2 vehicle speed\r\n    if (speed<0.83)\
    \ then\r\n        return true\r\n    else\r\n        return false\r\n    end\r\
    \nend\r\n\r\nfunction sleep(n)\r\n    os.execute(\"sleep \" .. tonumber(n))\r\n\
    end\r\n\r\nfunction check_condition_loop()\r\n    while cpp_get_signal(1) do\r\
    \n        sleep(CHECK_INTERVEL)\r\n        -- check if session open\r\n      \
    \  local is_open = cpp_get_signal(1)\r\n        if is_open then\r\n          \
    \  if check_condition() then\r\n                -- ok, do nothing\r\n        \
    \    else\r\n                -- close the session\r\n                local final_code=1\r\
    \n                local para_str=\"{\"\r\n                para_str=para_str..\"\
    \\\"code\\\":\"..final_code..\",\"\r\n                para_str=para_str..\"\\\"\
    msg\\\":\"..SESSION_ERROR_MSG\r\n                para_str=para_str..\"}\"\r\n\
    \                local TASK_ID= T2V_taskId or \"1234\"\r\n                cpp_remote_session(TASK_ID,\
    \ 2, para_str)\r\n                return false\r\n            end\r\n        else\r\
    \n            --session already closed, break\r\n            break\r\n       \
    \ end\r\n    end\r\n    return true\r\nend\r\n\r\nfunction main_entry()\r\n  \
    \  local TASK_ID= T2V_taskId or \"1234\"\r\n    cpp_print_log(\"task id:\"..T2V_taskId)\r\
    \n    local final_code=0\r\n    need_send_result=true\r\n    if check_condition()\
    \ then\r\n        local CMD_CODE= T2V_cmd or 1\r\n        cpp_remote_session(TASK_ID,\
    \ CMD_CODE, SESSION_TIME_OUT)\r\n        need_send_result=false\r\n        final_code=0\r\
    \n    else\r\n        final_code=1\r\n    end\r\n\r\n    -- upload reuslts\r\n\
    \    if need_send_result then\r\n        local para_str=\"{\"\r\n        para_str=para_str..\"\
    \\\"code\\\":\"..final_code..\",\"\r\n        para_str=para_str..\"\\\"msg\\\"\
    :\"..SESSION_ERROR_MSG\r\n        para_str=para_str..\"}\"\r\n        local CMD_CODE=\
    \ T2V_cmd or 1\r\n        cpp_upload_results(TASK_ID, para_str, CMD_CODE, 0) \
    \ -- route:0 mqtt, 1 http\r\n    end\r\n    -- 周期性检测\r\n    check_condition_loop()\r\
    \nend\r\n---------------------------------------------------------------------"
  vid: 3565f4e05d321dd1b0e8c56df952b5c2
